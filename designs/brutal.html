<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F3EEE3">
<title>My Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<script>
(function(){
  var p=new URLSearchParams(location.search), l=(p.get('lang')||'').toLowerCase();
  if(l!=='fa'&&l!=='en'){l=localStorage.getItem('lang')||((navigator.language||'').toLowerCase().indexOf('fa')===0?'fa':'en');}
  var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  var h=document.documentElement; h.lang=l; h.dir=l==='fa'?'rtl':'ltr'; h.dataset.theme=t;
})();
</script>
<style>
:root{
  --paper:#F3EEE3; --tile:#FFFDF8; --ink:#0E0E0E; --mute:#5b5852;
  --acid:#C6F432; --hot:#FF5B2E; --sky:#9BC8FF;
  --bw:3px; --sh:6px; --r:18px;
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.16,1,.3,1);
  --fa:'Vazirmatn',system-ui,sans-serif; --en:'Space Grotesk','Vazirmatn',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --font:var(--fa);
}
html[lang="en"]{--font:var(--en)}
html[data-theme="dark"]{--paper:#111111; --tile:#1B1B1B; --ink:#F3EEE3; --mute:#a9a49a; --hot:#FF6A3D; --sky:#7FB4FF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .5s var(--out),color .5s var(--out)}
/* subtle paper grain */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.06;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
html[data-theme="dark"] body::after{mix-blend-mode:screen;opacity:.05}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px;border-radius:6px}

.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 60px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.mark{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.1rem}
.mark b{width:38px;height:38px;border:var(--bw) solid var(--ink);border-radius:10px;background:var(--acid);color:#0E0E0E;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink);font-family:var(--en);transition:transform .4s var(--spring)}
.mark:hover b{transform:rotate(-12deg) scale(1.08)}
.ctrls{display:flex;gap:10px}
.dot{width:50px;height:50px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--tile);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;font:700 .95rem var(--en);transition:transform .3s var(--spring),box-shadow .15s,background-color .5s}
.dot:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.dot:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
#lang{background:var(--ink);color:var(--paper)}
#lang span{display:block;transition:transform .35s var(--spring),opacity .2s}
#lang.out span{transform:translateY(-140%);opacity:0}
#theme svg{width:22px;height:22px;stroke:var(--ink)}
#theme .moon{display:none} html[data-theme="dark"] #theme .sun{display:none} html[data-theme="dark"] #theme .moon{display:block}
#theme.spin svg{animation:spin .6s var(--spring)}
@keyframes spin{from{transform:rotate(-160deg) scale(.3)}}

/* ---------- tiles ---------- */
.tile{position:relative;background:var(--tile);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh) var(--sh) 0 var(--ink);padding:26px;overflow:hidden;
  transition:transform .35s var(--out),box-shadow .35s var(--out),background-color .5s var(--out);transform-style:preserve-3d}
.tile.hov:hover{transform:translate(-3px,-3px) rotateX(var(--rx,0)) rotateY(var(--ry,0));box-shadow:10px 10px 0 var(--ink)}
.tile.hov:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);transition-duration:.1s}
.label{font:700 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.label i{width:8px;height:8px;border-radius:50%;background:var(--hot);display:inline-block}

/* ---------- bento (home) ---------- */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(150px,auto);gap:18px}
.hero{grid-column:span 3;grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;min-height:340px}
.hero h1{font-size:clamp(2.6rem,6.6vw,5.4rem);line-height:1.02;font-weight:900;letter-spacing:-.03em;margin-top:18px}
html[lang="fa"] .hero h1{line-height:1.25;letter-spacing:0}
.hero h1 .u{position:relative;white-space:nowrap}
.hero h1 .u svg{position:absolute;inset-inline:0;bottom:-.08em;width:100%;height:.28em;overflow:visible}
.hero h1 .u path{stroke:var(--hot);stroke-width:7;fill:none;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420}
.page.in .hero h1 .u path{animation:draw 1s .5s var(--out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero p{max-width:520px;color:var(--mute);font-size:1.1rem;line-height:1.85;margin-top:18px}

.donate{grid-column:span 1;grid-row:span 2;background:var(--acid);color:#0E0E0E;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.donate .label{color:#0E0E0E99} .donate .label i{background:#0E0E0E}
.donate h2{font-size:2rem;font-weight:900;line-height:1.15}
.donate .go{width:64px;height:64px;border-radius:50%;background:#0E0E0E;color:var(--acid);display:grid;place-items:center;font-size:1.8rem;transition:transform .45s var(--spring);align-self:flex-end}
html[dir="rtl"] .donate .go{align-self:flex-start}
.donate .go span{display:block;transform:rotate(-45deg);transition:transform .45s var(--spring)}
html[dir="rtl"] .donate .go span{transform:rotate(-135deg)}
.donate:hover .go{transform:scale(1.12)}
.donate:hover .go span{transform:rotate(0)} html[dir="rtl"] .donate:hover .go span{transform:rotate(-180deg)}
.donate .ring{position:absolute;width:220px;height:220px;border:var(--bw) dashed #0E0E0E44;border-radius:50%;top:-70px;inset-inline-end:-80px;animation:rot 18s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.clock{grid-column:span 1;display:flex;flex-direction:column;justify-content:space-between}
.clock .t{font:700 2.1rem var(--mono);letter-spacing:-.02em;direction:ltr;text-align:start}
.clock .t em{font-style:normal;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.status{grid-column:span 1;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:space-between}
.status .label{color:inherit;opacity:.7} .status .label i{background:var(--acid);box-shadow:0 0 0 0 var(--acid);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.status strong{font-size:1.35rem;font-weight:800;line-height:1.4}
.slot{grid-column:span 2;border-style:dashed;box-shadow:none;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:16px}
.slot strong{font-size:1.25rem;font-weight:800}
.slot .plus{width:48px;height:48px;flex:none;border:var(--bw) dashed var(--ink);border-radius:12px;display:grid;place-items:center;font-size:1.5rem;opacity:.6}

/* ---------- donate page ---------- */
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:10px;font-weight:800;padding:12px 18px;border:var(--bw) solid var(--ink);border-radius:999px;background:var(--tile);box-shadow:3px 3px 0 var(--ink);transition:transform .25s var(--spring),box-shadow .15s,background-color .5s}
.back:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.back:active{transform:translate(3px,3px);box-shadow:none}
.back .a{display:inline-block;transition:transform .3s var(--spring)}
html[dir="rtl"] .back .a{transform:scaleX(-1)}
.back:hover .a{transform:translateX(-4px)} html[dir="rtl"] .back:hover .a{transform:scaleX(-1) translateX(-4px)}
.dtitle{grid-column:1/-1;background:var(--hot);color:#0E0E0E;padding:34px 30px}
.dtitle .label{color:#0E0E0Eaa} .dtitle .label i{background:#0E0E0E}
.dtitle h1{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:900;line-height:1.1;margin:14px 0 10px}
.dtitle p{max-width:560px;font-size:1.08rem;line-height:1.85;font-weight:600}
.dtitle .big{position:absolute;inset-inline-end:28px;bottom:-26px;font:900 9rem/1 var(--en);color:transparent;-webkit-text-stroke:3px #0E0E0E;opacity:.9;user-select:none}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.method{display:flex;flex-direction:column;gap:18px}
.method .num{font:700 3rem/1 var(--mono);color:transparent;-webkit-text-stroke:2px var(--ink)}
.method h3{font-size:1.45rem;font-weight:900}
.method .sub{color:var(--mute);margin-top:4px}
.box{display:flex;align-items:stretch;border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;background:var(--paper);transition:background-color .5s}
.box input{flex:1;min-width:0;border:0;background:none;padding:15px 16px;font:500 .9rem var(--mono);color:var(--ink);direction:ltr;text-align:left;outline:none}
.copy{position:relative;width:110px;flex:none;border-inline-start:var(--bw) solid var(--ink);background:var(--ink);color:var(--paper);font-weight:800;overflow:hidden}
.copy span{position:absolute;inset:0;display:grid;place-items:center;transition:transform .4s var(--spring)}
.copy .ok{transform:translateY(110%);background:var(--acid);color:#0E0E0E}
.copy.done .idle{transform:translateY(-110%)} .copy.done .ok{transform:none}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border:var(--bw) solid var(--ink);border-radius:14px;font-weight:800;font-size:1.05rem;box-shadow:4px 4px 0 var(--ink);transition:transform .2s var(--spring),box-shadow .15s}
.cta:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.cta:active{transform:translate(4px,4px);box-shadow:none}
.cta.acid{background:var(--acid);color:#0E0E0E} .cta.sky{background:var(--sky);color:#0E0E0E}
.share{margin-top:18px;display:flex;justify-content:center}
.share p{font:700 .8rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:10px 14px;border-radius:999px;transition:color .2s,background-color .2s}

/* ---------- motion ---------- */
.page{display:none}.page.on{display:block}
.page.in .rv{animation:pop .8s var(--out) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
::view-transition-old(root){animation:vtOut .35s var(--out) both}
::view-transition-new(root){animation:vtIn .5s var(--out) both}
@keyframes vtOut{to{opacity:0;transform:scale(.98)}} @keyframes vtIn{from{opacity:0;transform:translateY(16px)}}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,calc(100% + 60px));visibility:hidden;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-weight:800;z-index:99;transition:transform .45s var(--spring)}
.toast.show{transform:translate(-50%,0);visibility:visible}

@media (max-width:860px){
  .bento{grid-template-columns:1fr 1fr}
  .hero{grid-column:1/-1;grid-row:auto;min-height:0}
  .donate{grid-column:1/-1;grid-row:auto;min-height:190px}
  .slot{grid-column:1/-1}
  .methods{grid-template-columns:1fr}
  .dtitle .big{font-size:6rem}
}
@media (hover:none){.tile.hov:hover{transform:none;box-shadow:var(--sh) var(--sh) 0 var(--ink)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.hero h1 .u path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a href="#/" class="mark"><b><svg width="18" height="18" viewBox="0 0 24 24" fill="#0E0E0E"><path d="M12 0c.6 6.4 5.6 11.4 12 12-6.4.6-11.4 5.6-12 12-.6-6.4-5.6-11.4-12-12C6.4 11.4 11.4 6.4 12 0Z"/></svg></b><span data-t="brand"></span></a>
    <div class="ctrls">
      <button class="dot" id="theme" aria-label="Theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      </button>
      <button class="dot" id="lang" aria-label="Language"><span>EN</span></button>
    </div>
  </header>

  <!-- ============ HOME ============ -->
  <main class="page" id="home">
    <section class="bento">
      <div class="tile hero rv" style="--i:0">
        <div>
          <div class="label"><i></i><span data-t="hi"></span></div>
          <h1><span data-t="h1a"></span><br><span class="u"><span data-t="h1b"></span><svg viewBox="0 0 300 20" preserveAspectRatio="none"><path d="M4 14 C 70 4, 150 4, 296 12"/></svg></span></h1>
        </div>
        <p data-t="lead"></p>
      </div>

      <a href="#/donate" class="tile hov donate rv" style="--i:1">
        <div class="ring"></div>
        <div class="label"><i></i>DONATE</div>
        <h2 data-t="donate"></h2>
        <div class="go"><span>→</span></div>
      </a>

      <div class="tile clock rv" style="--i:2">
        <div class="label"><i></i><span data-t="time"></span></div>
        <div class="t" id="clk">00<em>:</em>00</div>
      </div>
      <div class="tile status rv" style="--i:3">
        <div class="label"><i></i>STATUS</div>
        <strong data-t="status"></strong>
      </div>
      <!-- 👇 جای گزینه‌های بعدی — هر کدوم رو با یه tile واقعی عوض کن -->
      <div class="tile slot rv" style="--i:4">
        <div><div class="label" data-t="soonL"></div><strong data-t="soon"></strong></div>
        <div class="plus">+</div>
      </div>
    </section>
  </main>

  <!-- ============ DONATE ============ -->
  <main class="page" id="donate">
    <div class="dhead rv" style="--i:0">
      <a href="#/" class="back"><span class="a">←</span><span data-t="back"></span></a>
    </div>
    <div class="tile dtitle rv" style="--i:1">
      <div class="label"><i></i>SUPPORT</div>
      <h1 data-t="dTitle"></h1>
      <p data-t="dLead"></p>
      <div class="big" aria-hidden="true">♥</div>
    </div>
    <section class="methods" style="margin-top:18px">
      <div class="tile method rv" style="--i:2">
        <div class="num">01</div>
        <div><h3 data-t="m1"></h3><div class="sub" data-t="m1d"></div></div>
        <div class="box"><input id="v1" readonly aria-label="link"><button class="copy" data-c="v1"><span class="idle" data-t="copy"></span><span class="ok">✓</span></button></div>
        <a id="open" class="cta acid" target="_blank" rel="noopener"><span data-t="open"></span> ↗</a>
      </div>
      <div class="tile method rv" style="--i:3">
        <div class="num">02</div>
        <div><h3 data-t="m2"></h3><div class="sub" data-t="m2d"></div></div>
        <div class="box"><input id="v2" readonly aria-label="address"><button class="copy" data-c="v2"><span class="idle" data-t="copy"></span><span class="ok">✓</span></button></div>
        <button class="cta sky" data-c="v2" data-plain><span data-t="copyAddr"></span> ⧉</button>
      </div>
    </section>
    <div class="share rv" style="--i:4"><p data-t="thanks"></p></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===================== ✏️ CONFIG ===================== */
const CONFIG = {
  donateLink: "https://daramet.com/Idea_atmosphere",
  donateAddress: "Soon",
  timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
};

const T = {
  fa:{brand:"صفحه من",hi:"سلام 👋",h1a:"یه گوشه کوچیک",h1b:"از اینترنت",
    lead:"حتی کوچیک‌ترین حمایت تو برام یک دنیا ارزش داره و به اشتیاقم برای ادامه‌ی مسیر و ساخت پروژه‌های جدید و رایگان انرژی میده.",
    donate:"راه‌های حمایت",time:"ساعت محلی شما",status:"در حال ساختن چیزهای جدید",soonL:"به‌زودی",soon:"بخش‌های جدید اینجا میان",
    back:"بازگشت",dTitle:"ممنون که حمایت می‌کنی",dLead:"هر حمایتی، هر چقدر کوچیک، انگیزه‌ی بزرگیه.\n",
    m1:"لینک دونیت",m1d:"پرداخت آنلاین با یه کلیک (برای کاربران داخل ایران)",m2:"آدرس کیف پول",m2d:"آدرس کیف پول",
    copy:"کپی",open:"رفتن به صفحه پرداخت",copyAddr:"کپی آدرس",copied:"کپی شد ✓",thanks:"از همراهیت صمیمانه ممنونم.",
    title:"صفحه من",titleD:"حمایت · صفحه من"},
  en:{brand:"My Page",hi:"HELLO 👋",h1a:"A small corner",h1b:"of the internet",
    lead:"Even the smallest support from you means the world to me and fuels my passion to keep going and build new, free projects.",
    donate:"Ways to support",time:"Your local time",status:"Building new things",soonL:"COMING SOON",soon:"New sections will land here",
    back:"Back",dTitle:"Thanks for the support",dLead:"Every support, however small, is a big motivation.\n",
    m1:"Donation link",m1d:"Pay online in one click (For users in Iran)",m2:"Wallet Address",m2d:"Wallet address",
    copy:"Copy",open:"Go to payment page",copyAddr:"Copy address",copied:"Copied ✓",thanks:"Thank you, sincerely",
    title:"My Page",titleD:"Donate · My Page"}
};

const H=document.documentElement, $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
let lang=H.lang;
const pageId=()=>location.hash==='#/donate'?'donate':'home';

function paint(){
  const t=T[lang];
  H.lang=lang; H.dir=lang==='fa'?'rtl':'ltr';
  $$('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  $('#lang span').textContent=lang==='fa'?'EN':'FA';
  document.title=pageId()==='donate'?t.titleD:t.title;
  const u=new URL(location); u.searchParams.set('lang',lang); history.replaceState(null,'',u);
  localStorage.setItem('lang',lang);
}
function enter(el){el.classList.remove('in');void el.offsetWidth;el.classList.add('in')}
function vt(fn){document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches?document.startViewTransition(fn):fn()}
function route(){
  const id=pageId();
  $$('.page').forEach(p=>p.classList.toggle('on',p.id===id));
  enter(document.getElementById(id)); paint(); scrollTo(0,0);
}
addEventListener('hashchange',()=>vt(route));

$('#lang').onclick=e=>{const b=e.currentTarget;b.classList.add('out');
  setTimeout(()=>{lang=lang==='fa'?'en':'fa';vt(()=>{paint();enter($('.page.on'))});b.classList.remove('out')},180)};
$('#theme').onclick=e=>{const b=e.currentTarget,n=H.dataset.theme==='dark'?'light':'dark';
  vt(()=>{H.dataset.theme=n});localStorage.setItem('theme',n);
  $('meta[name=theme-color]').content=n==='dark'?'#111111':'#F3EEE3';
  b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin')};

/* 3D tilt on hover (desktop) */
$$('.tile.hov').forEach(el=>{
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();
    el.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*8+'deg');
    el.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*8+'deg')});
  el.addEventListener('pointerleave',()=>{el.style.setProperty('--rx',0);el.style.setProperty('--ry',0)});
});

/* clock */
function tick(){const d=new Date().toLocaleTimeString('en-GB',{timeZone:CONFIG.timeZone,hour:'2-digit',minute:'2-digit'}).split(':');
  $('#clk').innerHTML=`${d[0]}<em>:</em>${d[1]}`}
tick();setInterval(tick,10000);

/* donate values + copy */
$('#v1').value=CONFIG.donateLink; $('#v2').value=CONFIG.donateAddress; $('#open').href=CONFIG.donateLink;
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600)};
async function copy(v){try{await navigator.clipboard.writeText(v)}catch{const a=document.createElement('textarea');a.value=v;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast(T[lang].copied)}
$$('[data-c]').forEach(b=>b.onclick=()=>{copy(document.getElementById(b.dataset.c).value);
  const btn=b.classList.contains('copy')?b:b.closest('.method').querySelector('.copy');
  btn.classList.add('done');setTimeout(()=>btn.classList.remove('done'),1400)});

if(H.dataset.theme==='dark')$('meta[name=theme-color]').content='#111111';
route();
